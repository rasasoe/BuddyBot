waypoints:
  living_room_center:
    pose:
      x: 2.0
      y: 0.0
      theta: 0.0
    description: Center of living room
    approach_distance: 0.5
  living_room_sofa:
    pose:
      x: 1.5
      y: -1.0
      theta: 1.57
    description: Near sofa area
    approach_distance: 0.3
  kitchen:
    pose:
      x: 4.0
      y: 2.0
      theta: 0.0
    description: Kitchen counter area
    approach_distance: 0.8
  kitchen_table:
    pose:
      x: 3.5
      y: 1.5
      theta: 0.78
    description: Kitchen dining table
    approach_distance: 0.5
  bedroom:
    pose:
      x: -1.0
      y: 3.0
      theta: 3.14
    description: Bedroom entrance
    approach_distance: 0.6
  front_door:
    pose:
      x: 0.0
      y: -2.0
      theta: 1.57
    description: Front door area
    approach_distance: 0.2
  back_door:
    pose:
      x: 5.0
      y: -1.0
      theta: -1.57
    description: Back door area
    approach_distance: 0.2
  charging_station:
    pose:
      x: -2.0
      y: 0.0
      theta: 0.0
    description: Robot charging station
    approach_distance: 0.1
  home_base:
    pose:
      x: 0.0
      y: 0.0
      theta: 0.0
    description: Home base position
    approach_distance: 0.0
destinations:
  greet_guest:
    sequence:
    - front_door
    - living_room_center
    description: Greet guest at front door then move to living room
  serve_kitchen:
    sequence:
    - kitchen
    - kitchen_table
    description: Move to kitchen then dining area
  return_home:
    sequence:
    - home_base
    description: Return to home base position
constraints:
  max_speed: 0.5
  max_turn_rate: 1.0
  safety_margin: 0.3
