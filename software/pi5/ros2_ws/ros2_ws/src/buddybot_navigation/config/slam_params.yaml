slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are empty, so nothing will be used
    map_file_name: ""
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: false

    # General Parameters
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 20.0 #for rastering images
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # Plugins
    plugins: ["async_slam_toolbox_plugin"]
    async_slam_toolbox_plugin: 
      plugin: "slam_toolbox::AsyncSlamToolboxPlugin"
      # Odometry-only loop closure
      do_loop_closing: true
      loop_match_minimum_chain_size: 10
      loop_match_maximum_variance: 0.5
      loop_match_minimum_response_ratio: 0.8
      # Correlation search
      correlation_search_window_size: 0.3
      correlation_search_translate_gain: 0.8
      correlation_search_rotate_gain: 0.8
      # Scan matching
      scan_match_minimum_chain_size: 10
      scan_match_maximum_variance: 0.5
      scan_match_minimum_response_ratio: 0.8
      # Link matching
      link_match_minimum_response_ratio: 0.8
      link_match_maximum_variance: 0.5
      # Scan processing
      scan_processing:
        minimum_time_interval: 0.5
      # Map updates
      map_updates:
        minimum_time_interval: 5.0