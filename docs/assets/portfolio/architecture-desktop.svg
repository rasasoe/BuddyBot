<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">BuddyBot control architecture — Sensors, ROS 2, Pico</title>
<desc id="desc">A consistent dark, high-contrast architecture diagram showing sensors and user requests entering Raspberry Pi 5 command arbitration and safety control, then Pico motor control and watchdog.</desc>
<rect width="1200" height="460" fill="#0D0F10"/>
<g font-family="Georgia,'Times New Roman',serif" fill="#F1EFEA">
  <text x="48" y="55" font-size="27" letter-spacing="0.5">System Architecture</text>
  <text x="1152" y="53" font-family="Arial,sans-serif" font-size="13" text-anchor="end" letter-spacing="2.1" fill="#AEB0AC">BUDDYBOT / ROS 2</text>
</g>
<line x1="48" y1="77" x2="1152" y2="77" stroke="#525655" stroke-width="1"/>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="48" y="112" width="330" height="250" fill="#181B1C" stroke="#5B605F" stroke-width="1.2"/>
  <rect x="435" y="112" width="330" height="250" fill="#181B1C" stroke="#5B605F" stroke-width="1.2"/>
  <rect x="822" y="112" width="330" height="250" fill="#181B1C" stroke="#5B605F" stroke-width="1.2"/>
  <g fill="#B7BDBB" font-size="15" letter-spacing="2">
    <text x="72" y="147">01 / SENSING &amp; REQUESTS</text>
    <text x="459" y="147">02 / DECISION &amp; SAFETY</text>
    <text x="846" y="147">03 / ACTUATION</text>
  </g>
  <g fill="#F2F1ED" font-weight="600" font-size="26">
    <text x="72" y="198">Sensors &amp; User</text>
    <text x="459" y="198">Raspberry Pi 5</text>
    <text x="846" y="198">Raspberry Pi Pico</text>
  </g>
  <g fill="#CAD0CE" font-size="19">
    <text x="72" y="243">LiDAR / ToF / Camera</text>
    <text x="72" y="276">Microphone / Manual UI</text>
    <text x="72" y="309">Optional server requests</text>
    <text x="459" y="243">ROS 2 navigation &amp; follow</text>
    <text x="459" y="276">Command arbitration</text>
    <text x="459" y="309">Safety override &amp; bridge</text>
    <text x="846" y="243">Encoder / Motor control</text>
    <text x="846" y="276">Watchdog &amp; stop latch</text>
    <text x="846" y="309">3-wheel omni drive</text>
  </g>
  <g stroke="#A9AFAC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M384 242H427M416 232L427 242L416 252"/>
    <path d="M771 242H814M803 232L814 242L803 252"/>
  </g>
  <line x1="48" y1="390" x2="1152" y2="390" stroke="#525655"/>
  <text x="48" y="423" font-size="16" fill="#BFC5C1">AI and server software request actions; the Pi 5 / Pico path remains responsible for motor output.</text>
</g>
</svg>