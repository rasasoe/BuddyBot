<svg xmlns="http://www.w3.org/2000/svg" width="600" height="930" viewBox="0 0 600 930" role="img" aria-labelledby="title desc">
<title id="title">BuddyBot mobile control architecture</title>
<desc id="desc">A vertical dark diagram with consistently styled panels for sensors, Raspberry Pi 5 ROS 2, and Raspberry Pi Pico motor control. No alternating black-white panels.</desc>
<rect width="600" height="930" fill="#0D0F10"/>
<g font-family="Georgia,'Times New Roman',serif" fill="#F1EFEA">
 <text x="34" y="57" font-size="29">System Architecture</text>
</g>
<text x="34" y="90" fill="#ABB1AE" font-size="15" font-family="Arial,sans-serif" letter-spacing="1.2">BUDDYBOT / ROS 2 / CONTROL FLOW</text>
<line x1="34" y1="111" x2="566" y2="111" stroke="#525655"/>
<g font-family="Arial,Helvetica,sans-serif">
 <g fill="#181B1C" stroke="#5B605F" stroke-width="1.4">
 <rect x="34" y="139" width="532" height="206"/>
 <rect x="34" y="398" width="532" height="206"/>
 <rect x="34" y="657" width="532" height="206"/>
 </g>
 <g font-size="15" letter-spacing="2" fill="#B7BDBB">
  <text x="56" y="174">01 / SENSING &amp; REQUESTS</text>
  <text x="56" y="433">02 / DECISION &amp; SAFETY</text>
  <text x="56" y="692">03 / ACTUATION</text>
 </g>
 <g font-size="28" fill="#F2F1ED" font-weight="600">
  <text x="56" y="216">Sensors &amp; User</text>
  <text x="56" y="475">Raspberry Pi 5</text>
  <text x="56" y="734">Raspberry Pi Pico</text>
 </g>
 <g font-size="21" fill="#CAD0CE">
  <text x="56" y="257">LiDAR / ToF / Camera</text>
  <text x="56" y="287">Voice / Manual / Server request</text>
  <text x="56" y="516">ROS 2 navigation / follow</text>
  <text x="56" y="546">Command mux / safety override</text>
  <text x="56" y="775">Encoder / PWM / watchdog</text>
  <text x="56" y="805">3-wheel omni drive</text>
 </g>
 <g fill="none" stroke="#B3B8B5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
  <path d="M300 352V384M290 374L300 384L310 374"/>
  <path d="M300 611V643M290 633L300 643L310 633"/>
 </g>
 <text x="34" y="905" fill="#AEB4B0" font-size="15">High-level AI requests never directly actuate motors.</text>
</g>
</svg>